# AIIMS+ local development environment (IDR-0016).
#
# Local substitutes for the frozen AWS substrate — SAME seams, different
# provider: Postgres 16 ↔ Aurora (IDR-0006), Redis ↔ ElastiCache (IDR-0007),
# Keycloak dev realm ↔ Keycloak on Fargate (ADR-0008), MinIO ↔ S3 (IDR-0008;
# idle until a stage needs object storage). SYNTHETIC data only — never PHI
# in any non-prod environment (TDR-0013). All credentials below are
# local-dev-only defaults.
#
# Bring-up:  docker compose up -d
#            pnpm db:migrate && pnpm db:seed
#            pnpm dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiims
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiims"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/aiims HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the dev bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aiims-dev &&
      echo 'bucket aiims-dev ready'"

volumes:
  pgdata:
  miniodata:
