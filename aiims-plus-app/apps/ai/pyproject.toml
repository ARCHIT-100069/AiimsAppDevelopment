# AIIMS+ AI plane — isolated Python FastAPI service (AIDR-0003).
# Operational-only by Constitution; reached ONLY via the core's AiGateway port.
# Activates behind feature flags + HITL + release-blocking safety evals (Stage 7).
# The model provider is configurable (mock | http); no credentials ⇒ mock.
[project]
name = "aiims-ai"
version = "0.7.0"
description = "AIIMS+ operational-only AI plane (Constitution-bound; never diagnosis/treatment)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
]

[project.optional-dependencies]
# httpx activates the real HTTP provider; only needed when a model is configured.
dev = ["mypy>=1.10", "pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["aiims_ai"]
