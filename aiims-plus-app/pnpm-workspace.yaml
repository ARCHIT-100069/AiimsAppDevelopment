packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
# Native build scripts vetted for the toolchain: esbuild (vitest),
# cpu-features/ssh2 (testcontainers), protobufjs (testcontainers),
# unrs-resolver (eslint-import-resolver-typescript).
allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: true # bullmq native codec
  protobufjs: true
  sharp: true # next.js image optimization
  ssh2: true
  unrs-resolver: true

# Security overrides (SDR-0012): force patched transitive versions.
# handlebars: GHSA JS-injection/DoS fixes (via eslint-plugin-boundaries)
# multer: DoS fixes (via @nestjs/platform-express)
# postcss: XSS fix (via next)
overrides:
  handlebars: ">=4.7.9"
  multer: ">=2.2.0"
  postcss: ">=8.5.10"
